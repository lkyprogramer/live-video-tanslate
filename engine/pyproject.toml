[project]
name = "local-video-subtitle"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "websockets==17.4", "pydantic==2.14.3",
    "numpy==2.5.4", "sherpa-onnx==2.0.1", "whisperlivekit[mlx-llm-mt]",
    "mlx==0.31.2", "mlx-lm==0.31.3", "transformers==5.22.1", "huggingface-hub==2.4.0",
]

[project.scripts]
subtitle-server = "subtitle_service.cli:serve"
subtitle-replay = "subtitle_service.replay:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx2>=2,<3", "jsonschema>=4,<5"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
whisperlivekit = { git = "https://github.com/QuentinFuxa/WhisperLiveKit.git", rev = "13ee8515f136e0fd0bf31fb8ab0b63ab10670fa2" }
